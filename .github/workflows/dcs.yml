name: dcs-proof-enforcement

on:
  push:
    branches: ["phase4/ci-wedge"]
  pull_request:
    branches: ["phase4/ci-wedge"]
  workflow_dispatch: {}

concurrency:
  group: dcs-proof-enforcement
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/deterministic-intent/dcs-tier3@sha256:6991cf87d8f199dc9c91f9f77a5b880c639473058c462f344b921d3928258330

    # Workaround: defaults.run.working-directory is IGNORED for container jobs.
    # Inject workspace path and cd explicitly in steps that need git.
    env:
      REPO_ROOT: ${{ format('/__w/{0}/{0}', github.event.repository.name) }}

    permissions:
      contents: read
      packages: read   # pull ghcr.io container

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight (tracked files must be clean)
        run: |
          cd "$REPO_ROOT"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Policy guard — no model artifacts/references
        run: |
          cd "$REPO_ROOT"
          bash scripts/ci/verify_no_llm_artifacts.sh

      - name: Hard guard — banned dirs must not exist (repo)
        run: |
          cd "$REPO_ROOT"
          test ! -d scraper
          test ! -d agents
          test ! -d .cursor
          test ! -d db

      - name: Provision snapshot (immutable, hash-checked)
        env:
          SNAPSHOT_ID: 20260208T190113Z
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$REPO_ROOT"

          mkdir -p dcs/snapshots nlc/db/snapshots

          ASSET_NAME="${SNAPSHOT_ID}.tar.gz"
          RELEASE_TAG="snapshot-${SNAPSHOT_ID}"

          ASSET_ID="$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print([a['id'] for a in r['assets'] if a['name']=='${ASSET_NAME}'][0])")"

          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            -o "dcs/snapshots/${ASSET_NAME}"

          (cd dcs/snapshots && sha256sum -c "${SNAPSHOT_ID}.sha256")

          tar -C nlc/db/snapshots -xzf "dcs/snapshots/${ASSET_NAME}"

          test -d "nlc/db/snapshots/${SNAPSHOT_ID}"

      - name: Proof run (canonical v1 entrypoint, no cache)
        env:
          DCS_SKIP_TIER3_BUILD: "1"   # already in tier3 container; skip build
        run: |
          cd "$REPO_ROOT"
          rm -rf out
          mkdir -p out
          echo "AUDIT_SCOPE=v1"
          AUDIT_SCOPE=v1 bash proof/run_proof.sh

      - name: Compare proof hashes (atomic)
        run: |
          cd "$REPO_ROOT"
          diff -u dcs/expected_proof_hashes_v1.json out/proof_hashes.json

      - name: Postflight (no tracked mutation)
        run: |
          cd "$REPO_ROOT"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
